plugins {
    id 'com.android.application'
}

android {
    namespace 'app.hamsohbat'
    compileSdk 34

    defaultConfig {
        applicationId 'app.hamsohbat'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0-demo'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
