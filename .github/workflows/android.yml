name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Copy web app into the APK assets
        run: |
          mkdir -p android/app/src/main/assets
          cp web/index.html android/app/src/main/assets/index.html

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Hamsohbat-demo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Hamsohbat-demo-apk
          path: Hamsohbat-demo.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Hamsohbat demo v0.1.${{ github.run_number }}
          body: Demo build (simulated peers, translation and emergency dispatch). Install Hamsohbat-demo.apk on Android 7 or newer.
          files: Hamsohbat-demo.apk
